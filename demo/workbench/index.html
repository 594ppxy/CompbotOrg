.bt-set-section>h3,.bt-la-sec-head>h3{font-size:13px;line-height:18px;font-weight:600;margin:0 0 -2px;padding:0 4px}
.bt-browser-settings{display:flex;flex-direction:column;gap:20px}
.bt-set-card{border:1px solid var(--bt-line);border-radius:12px;background:var(--bt-card);display:flex;flex-direction:column}
.bt-set-card>*+*{border-top:.5px solid var(--bt-line)}
.bt-set-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;color:var(--bt-ink);font:inherit;font-size:13px;line-height:18px;text-align:left;width:100%;box-sizing:border-box;border-radius:0}

.bt-set-card>.bt-set-row+.bt-set-row{border-top:.5px solid var(--bt-line)}
.bt-set-row:first-child{border-top-left-radius:12px;border-top-right-radius:12px}
.bt-set-row:last-child{border-bottom-left-radius:12px;border-bottom-right-radius:12px}
.bt-set-copy{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.bt-set-hint{font-size:12px;line-height:16px;color:color-mix(in srgb,var(--bt-ink-2) 50%,var(--bt-ink-3))}
.bt-set-control{flex:none;display:flex;align-items:center;gap:6px}
.bt-set-places .bt-set-control{flex:0 1 auto;max-width:50%;min-width:0}

.bt-set-model .bt-set-control{flex:0 1 auto;min-width:0;max-width:65%}
.bt-set-number{width:112px}
.bt-set-places .bt-set-hint{overflow-wrap:anywhere}
.bt-set-value{font-size:13px;color:var(--bt-ink-2);text-align:right}
.bt-set-bot{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.bt-browser-note{margin:0;padding:10px 12px;color:var(--bt-ink-2);font-size:12px;line-height:17px}
.bt-browser-grant{display:flex;align-items:center;gap:12px;padding:10px 12px}

.bt-browser-grant-who{display:flex;align-items:center;gap:8px;flex:0 0 150px;min-width:0;font-size:13px}

.bt-browser-grant-meta{display:flex;flex:1;flex-direction:column;gap:4px;min-width:0}

.bt-la-head{display:flex;align-items:baseline;gap:8px;min-width:0}
.bt-la-name{font-size:13px;line-height:18px;font-weight:500;color:var(--bt-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-la-ver{flex:none;font-size:12px;line-height:16px;color:var(--bt-ink-3);font-variant-numeric:tabular-nums}
.bt-la-path{font-size:12px;line-height:16px;font-family:var(--bt-mono);color:var(--bt-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-la-note{margin-top:2px}
.bt-la-actions{gap:8px}

.bt-set-form{display:flex;flex-direction:column;gap:12px;padding:12px}
.bt-set-form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bt-set-field{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:12px;line-height:16px;font-weight:500;color:var(--bt-ink-2)}

/* Settings → Phone. */

/* Settings → Connectors. */
.bt-connector{display:flex;flex-direction:column;gap:10px;padding:12px}
.bt-connector-head{display:flex;align-items:center;gap:12px;min-width:0}
.bt-connector-mark{flex:none;width:36px;height:36px;border-radius:10px;background:var(--bt-card);border:.5px solid var(--bt-line);display:flex;align-items:center;justify-content:center;color:var(--bt-ink)}
.bt-connector-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bt-connector-name{font-size:14px;line-height:20px;font-weight:500}
.bt-connector-status{font-size:12px;line-height:16px;color:var(--bt-ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-connector[data-state=ready] .bt-connector-status{color:var(--bt-ink-2)}
.bt-connector[data-state=error] .bt-connector-status{color:var(--bt-danger);white-space:normal}
.bt-connector-actions{flex:none;display:flex;gap:6px}
.bt-connector-form{display:flex;flex-direction:column;gap:8px;padding-left:48px;animation:bt-q-in 420ms linear(0.0000,0.0510,0.1692,0.3153,0.4639,0.6001,0.7163,0.8102,0.8823,0.9350,0.9717,0.9955,1.0098,1.0171,1.0198,1.0195,1.0175,1.0147,1.0117,1.0089,1.0064,1.0044,1.0028,1.0016,1.0000),bt-veil-in .2s ease-out}
.bt-connector-form-row{display:flex;align-items:center;gap:6px}
.bt-connector-form-row>:first-child{margin-right:auto}
.bt-connector-link{flex:none;padding:0;border:0;background:none;font:inherit;font-size:12px;color:var(--bt-ink-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.bt-connector-link:hover:not(:disabled){color:var(--bt-ink)}
.bt-connector-wait{flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--bt-ink-2)}
.bt-connector-aside{align-self:flex-start}
.bt-connector-error{padding-left:48px;font-size:12px;line-height:16px;color:var(--bt-danger)}
.bt-connector-banner{padding:0 0 8px}
.bt-mail-form{gap:10px}
.bt-mail-seg{align-self:flex-start}
/* Six providers share the width: a label that wraps would leave its fixed-height
   button and spill out of the pill, so every provider name stays on one line. */
.bt-mail-seg button{white-space:nowrap}
.bt-mail-guide{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:var(--bt-hover);font-size:12px;line-height:18px;color:var(--bt-ink-2)}
.bt-mail-guide ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.bt-mail-links{display:flex;gap:16px}
.bt-mail-error{font-size:12px;line-height:16px;color:var(--bt-danger)}
.bt-mail-rules{gap:4px}
.bt-mail-rules-title{font-size:12px;line-height:16px;font-weight:500;color:var(--bt-ink-2)}
.bt-mail-rule{display:flex;align-items:center;gap:12px;min-height:36px}
.bt-mail-rule-name{font-size:13px;line-height:18px;color:var(--bt-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Shell chrome reshaped for the team view. Selectors use stable data attributes where the
   shell offers them and CSS-module name suffixes elsewhere. */
[class*="_newSession"],nav[class*="_panelList"],[class*="_logoRow"]>[class*="_brand"],[class*="_logoRow"]:not(:has([class*="_toggle"])){display:none!important}
/* The shell's sidebar switch stays where the shell puts it whenever the sidebar is
   collapsed: on the rail, or fixed in a Windows title bar, where it also stays while
   the sidebar is open. Elsewhere an open sidebar uses the team's own top row. */
html:not([data-windows-titlebar]) :not([class*="_collapsed"])>[class*="_logoRow"]{display:none!important}
html[data-windows-titlebar] :not([class*="_collapsed"])>[class*="_logoRow"]{height:0!important;margin:0!important}
html[data-windows-titlebar] .bt-side-collapse{display:none}
/* Under a Windows title bar our own switch replaces the shell's: the shell's
   toggle expands the shell sidebar first, and pulling it back afterwards is a
   visible flash of the shell's column. A host whose window controls stand at the band's
   left (the macOS traffic lights) sets --bt-caption-start to the room they take. */
html[data-windows-titlebar] [class*="_logoRow"]>[class*="_toggle"]{display:none!important}
html[data-windows-titlebar] .bt-title-toggle{position:fixed;left:calc(12px + var(--bt-caption-start,0px));top:calc((var(--dsh-windows-titlebar-height,0px) - 28px) / 2);width:28px;height:28px;z-index:30;-webkit-app-region:no-drag;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;padding:0;background:transparent;color:var(--bt-ink);cursor:pointer;font-family:var(--bt-font)}
html[data-windows-titlebar] .bt-title-toggle:hover{background:var(--bt-hover)}
/* Elsewhere the switch shows only while the column is hidden, where the column's
   own top row had it. */
html:not([data-windows-titlebar]) .bt-title-toggle{position:fixed;left:12px;top:calc(var(--dsh-frame-top-clearance,0px) + 6px);z-index:30}
/* The footer ends in the Bot row: the whale's settings seat, then the account menu
   when no plugin holds that seat. Every other plugin's entry takes a whole row above
   it, in the shell's order, so none of them squeezes the Bot row. */
[class*="_footArea"]{grid-template-columns:auto minmax(0,1fr);grid-auto-flow:row dense;align-items:center;gap:4px 9px;padding:8px 6px 6px!important}
/* DSH hides the footer of a collapsed sidebar under a Windows title bar; the grid
   stays out of that one place. */
html:not([data-windows-titlebar]) [class*="_footArea"],:not([class*="_collapsed"])>[class*="_footArea"]{display:grid!important}
[class*="_footArea"]>[class*="_footerActions"],[class*="_footArea"]>[class*="_footerActions"]>div{display:contents!important}
[class*="_footArea"]>[class*="_footerActions"]>div>*{grid-column:1/-1}
[class*="_footArea"]>[class*="_settingsArea"]{grid-column:1;order:1;width:auto!important}
[class*="_footArea"] button[aria-label="Settings"]{width:auto!important;padding:0!important;background:none!important;border-radius:50%!important;height:auto!important}
[class*="_widthHandle"]{display:none!important}

.bt-voice-pane{flex-direction:column;align-items:center;justify-content:center;animation:bt-fade .2s ease-out}
.bt-voice-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;max-width:560px;text-align:center}
.bt-voice-orb{position:relative;width:200px;height:200px;display:grid;place-items:center;margin-bottom:8px}
.bt-voice-ring{position:absolute;inset:34px;border-radius:50%;background:var(--bt-hover);transform:scale(calc(1 + var(--bt-level,0) * .55));transition:transform .08s linear}
.bt-voice-ring-2{inset:14px;background:none;box-shadow:inset 0 0 0 1px var(--bt-line-2);transform:scale(calc(.94 + var(--bt-level,0) * .3));opacity:.8}
.bt-voice-stage[data-phase=thinking] .bt-voice-ring{animation:bt-voice-breathe 1.6s ease-in-out infinite}
.bt-voice-stage[data-phase=speaking] .bt-voice-ring{animation:bt-voice-speak .9s ease-in-out infinite}
@keyframes bt-voice-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes bt-voice-speak{0%,100%{transform:scale(1.04)}30%{transform:scale(1.2)}60%{transform:scale(1.1)}}
.bt-voice-orb>.bt-mark{position:relative}
.bt-voice-name{font-size:16px;line-height:22px;font-weight:500}
.bt-voice-status{font-size:13px;line-height:18px;color:var(--bt-ink-2);min-height:18px}
.bt-voice-caption{min-height:44px;font-size:15px;line-height:22px;color:var(--bt-ink);animation:bt-blur-in .25s ease-out;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bt-voice-note{font-size:12px;color:var(--bt-danger)}
.bt-voice-setup{height:32px;padding:0 14px;border-radius:16px;border:0;background:var(--bt-hover);color:var(--bt-ink);font:inherit;font-size:13px;cursor:pointer;transition:background-color .15s ease}
.bt-voice-setup:hover{background:var(--bt-active)}
.bt-voice-bar{display:flex;gap:16px;padding:0 0 32px}
.bt-voice-btn{position:relative;width:52px;height:52px;border-radius:50%;border:0;background:var(--bt-hover);color:var(--bt-ink);display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease,transform .12s ease}
.bt-voice-btn:hover{background:var(--bt-active)}
.bt-voice-btn:active{transform:scale(.94)}
.bt-voice-btn[aria-pressed=true]{background:var(--bt-user);color:var(--bt-user-ink)}
.bt-voice-slash{position:absolute;width:24px;height:2px;border-radius:1px;background:currentColor;transform:rotate(-45deg)}
.bt-voice-end{background:#ff3e51;color:#fff}
.bt-voice-end:hover{background:#e02135}
@keyframes bt-fade{from{opacity:0}to{opacity:1}}
@keyframes bt-blur-in{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:blur(0)}}
@media (prefers-reduced-motion:reduce){.bt-voice-pane,.bt-voice-caption,.bt-voice-ring{animation:none!important}}
/* A bubble takes the set share of the column, as the user's does; 82px stays free for
   the hover toolbar beside it: a 6px margin and three 24px tools 2px apart. */
.bt-msg{display:flex;flex-direction:column;align-items:flex-start;max-width:min(calc(var(--bt-msg-w) * 100%),calc(100% - 82px))}
/* The bubble's row: reactions hang below it, so the hover toolbar (and a group
   sender's avatar) line up with the bubble alone. */
.bt-msg-line{position:relative;display:flex;align-items:flex-end;gap:8px;max-width:100%}
.bt-msg-line>.bt-bubble{max-width:none;min-width:0}
/* The same bubble width as beside an avatar column: the share of (100% - 30px), plus the 30px. */
.bt-astack[data-lead]>.bt-msg{max-width:min(calc(var(--bt-msg-w) * (100% - 30px) + 30px),calc(100% - 82px))}
/* The indent of earlier rows comes out of their line, so their toolbar keeps its 82px too. */
.bt-astack[data-lead]>.bt-msg:not(:last-child)>.bt-msg-line{max-width:calc(100% - 30px)}
.bt-tools{position:absolute;bottom:0;z-index:0;left:100%;margin-left:6px;display:flex;gap:2px;opacity:0;visibility:hidden;transition:opacity .12s ease,visibility .12s}
/* The hover bridge spans only the 6px gap (plus a little overlap) between the
   bubble's edge and the toolbar: wider, it sits over the bubble's tail and
   blocks text selection and link clicks there. Its z-index:-1 only stays under
   the toolbar, not under the full-width .bt-astack, because z-index:0 above
   gives the toolbar its own stacking context. */
.bt-tools::after{content:"";position:absolute;top:-8px;bottom:-8px;right:100%;width:10px;z-index:-1}
.bt-msg:hover>.bt-msg-line>.bt-tools,.bt-msg:focus-within>.bt-msg-line>.bt-tools,.bt-tools[data-open]{opacity:1;visibility:visible}
/* The flat layout: a Bot's text has no bubble and takes its own share of the column
   (the whole of it unless set). The toolbar floats over the message's bottom right. */
body[data-bt-layout=flat] .bt-astack{align-items:stretch;gap:10px}
body[data-bt-layout=flat] .bt-msg,body[data-bt-layout=flat] .bt-astack[data-lead]>.bt-msg{align-items:stretch;max-width:calc(var(--bt-flat-w) * 100%)}
body[data-bt-layout=flat] .bt-bubble{background:none;padding:0;border-radius:0}
body[data-bt-layout=flat] .bt-tools{bottom:-14px;right:0;left:auto;margin-left:0;transform:none;padding:2px;border-radius:999px;background:var(--bt-card);box-shadow:inset 0 0 0 .5px var(--bt-line-2),0 4px 14px rgba(0,0,0,.14)}
/* With reactions below, the toolbar stays inside the message row instead of
   covering their top edge when the hover shows it. */
body[data-bt-layout=flat] .bt-msg:has(>.bt-reacts) .bt-tools{bottom:0}
body[data-bt-layout=flat] .bt-tools::after{display:none}
.bt-tool{width:24px;height:24px;border:0;padding:0;border-radius:6px;background:none;color:var(--bt-ink-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .12s ease,color .12s ease}

.bt-react:hover{background:var(--bt-hover)}

/* Phone-width viewports: the settings dialog takes the whole screen, its page
   list becomes a horizontal strip across the top, and fixed-width pages wrap
   or scroll instead of overflowing. These rules sit at the end of the sheet:
   the base column widths below would otherwise win the cascade back. */
@media (max-width:640px){
  .bt-settings-layer{align-items:stretch;justify-content:stretch}
  .bt-settings{--bt-set-w:100vw;--bt-set-h:100vh;width:100vw;height:100vh;height:100dvh;border-radius:0;border-width:0;flex-direction:column}
  /* Right padding is not honored inside a scrolling flex row; a transparent
     right border keeps the last tab clear of the close button. */
  .bt-settings-nav{width:100%;flex:none;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border:0;border-right:52px solid transparent;border-bottom:.5px solid var(--bt-line);scrollbar-width:thin;box-sizing:border-box}
  .bt-settings-item{flex:none}
  .bt-settings-rule{width:.5px;height:16px;margin:0 4px}
  .bt-settings-main{width:100%;flex:1;min-height:0;height:auto}
  .bt-settings-usage[data-off]{left:0;width:100%}
  .bt-settings-scroll{overflow-x:clip}
  .bt-set-row{flex-direction:column;align-items:stretch;gap:8px}
  .bt-set-row>.bt-set-copy{width:100%}
  .bt-la-row{flex-direction:row;align-items:center;flex-wrap:wrap}
  .bt-la-row>.bt-set-copy{width:auto}
  .bt-set-model .bt-set-control{max-width:none}
  .bt-avedit{width:min(300px,calc(100vw - 32px))}
  .bt-shape-row{grid-template-columns:repeat(4,1fr)}
}
/* Follow the visible viewport, not the layout one: dvh where the browser knows
   it (the earlier vh value is the fallback), and safe-area padding where
   full-screen layers and bottom regions meet the device's own bars. */
.bt-settings{--bt-set-h:min(780px,calc(100dvh - 2*max(32px,var(--dsh-frame-overlay-top,32px))))}
.bt-mem{height:min(760px,calc(100dvh - 2*max(32px,var(--dsh-frame-overlay-top,32px))))}
.bt-settings-layer,.bt-mem-layer,.bt-palette-layer{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bt-panel{padding-bottom:env(safe-area-inset-bottom,0px)}
.bt-settings-scroll{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.bt-voice-bar{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.bt-exchange .bt-dialog-foot{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
/* iOS zooms the whole page on focused inputs under 16px. */
@media (max-width:640px) and (pointer:coarse){
  .bt-input,.bt-bs-input,.bt-browser-address input,.bt-folder-input,.bt-secret-input,.bt-q-input,.bt-to input,.bt-palette-head input,.bt-mem-input{font-size:16px}
}

/* ---------- detail views ---------- */
.cb-detail{flex:1;min-height:0;overflow:auto;padding:18px 22px 28px}
.cb-crumb{display:inline-flex;align-items:center;gap:5px;margin-bottom:10px;padding:3px 8px 3px 4px;border:0;border-radius:8px;background:transparent;color:var(--bt-ink-3);font-size:10px;cursor:pointer}
.cb-crumb:hover{background:var(--bt-hover);color:var(--bt-ink)}
.cb-detail-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.cb-detail-title{font-size:20px;font-weight:800;line-height:26px}
.cb-detail-sub{margin-top:3px;font-size:11px;color:var(--bt-ink-2)}
.cb-detail-actions{margin-left:auto;display:flex;gap:6px;flex:none}
.cb-detail-actions button{padding:6px 11px;border:1px solid var(--bt-line);border-radius:9px;background:var(--bt-card);font-size:10px;color:var(--bt-ink-2);cursor:pointer;white-space:nowrap}
.cb-detail-actions button:hover{background:var(--bt-hover);color:var(--bt-ink)}
.cb-detail-actions button.primary{border-color:transparent;background:var(--bt-accent);color:#fff}
.cb-detail-actions button.primary:hover{filter:brightness(1.08)}

.cb-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--bt-tag-bg);color:var(--bt-tag-ink);font-size:9px;font-weight:650;white-space:nowrap}
.cb-badge-green{background:var(--bt-accent-soft);color:var(--bt-green)}
.cb-badge-amber{background:var(--bt-accent-soft);color:var(--bt-star)}
.cb-badge-red{background:var(--bt-danger-soft);color:var(--bt-danger)}
.cb-badge-accent{background:var(--bt-accent-soft);color:var(--bt-accent)}

.cb-tabs2{display:flex;gap:2px;margin:14px 0 12px;border-bottom:1px solid var(--bt-line)}
.cb-tabs2 button{padding:8px 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--bt-ink-3);font-size:11px;cursor:pointer}
.cb-tabs2 button:hover{color:var(--bt-ink)}
.cb-tabs2 button.is-current{border-bottom-color:var(--bt-accent);color:var(--bt-accent);font-weight:700}

.cb-panel{border:1px solid var(--bt-line);border-radius:12px;background:var(--bt-card);padding:12px}
.cb-panel + .cb-panel{margin-top:10px}
.cb-panel h5{margin:0 0 9px;font-size:11px;font-weight:750}
.cb-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cb-panel-head h5{margin:0}

.cb-kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.cb-kv-row{display:flex;flex-direction:column;gap:2px;min-width:0}
.cb-kv-label{font-size:9px;color:var(--bt-ink-3)}
.cb-kv-value{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cb-progress-lg{height:6px;border-radius:999px;background:var(--bt-line);overflow:hidden;margin:8px 0 4px}
.cb-progress-lg i{display:block;height:100%;border-radius:999px;background:var(--bt-accent)}

.cb-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cb-pcard{display:flex;flex-direction:column;gap:7px;padding:12px;border:1px solid var(--bt-line);border-radius:12px;background:var(--bt-card);cursor:pointer;text-align:left}
.cb-pcard:hover{border-color:var(--bt-accent);box-shadow:0 6px 18px -12px rgba(0,0,0,.4)}
.cb-pcard-top{display:flex;align-items:center;gap:7px}
.cb-pcard-name{flex:1;min-width:0;font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-pcard-goal{font-size:10px;color:var(--bt-ink-2);line-height:16px;min-height:32px}
.cb-pcard-foot{display:flex;align-items:center;gap:8px;font-size:9px;color:var(--bt-ink-3)}
.cb-pcard-foot .cb-bar{flex:1;width:auto}

.cb-kb{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.cb-kb-col{flex:1 1 0;min-width:150px;padding:9px;border:1px solid var(--bt-line);border-radius:12px;background:var(--bt-hover)}
.cb-kb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:10px;font-weight:750}
.cb-kb-card{display:flex;flex-direction:column;gap:5px;overflow:hidden;padding:9px;margin-bottom:6px;border:1px solid var(--bt-line);border-radius:10px;background:var(--bt-card);cursor:pointer;text-align:left}
.cb-kb-card:hover{border-color:var(--bt-accent)}
.cb-kb-card strong{font-size:10px;font-weight:700;line-height:14px}
.cb-kb-card small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;color:var(--bt-ink-3)}
.cb-kb-meta{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;white-space:nowrap;font-size:8px;color:var(--bt-ink-3)}

.cb-doc{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bt-line);border-radius:10px;background:var(--bt-card);cursor:pointer}
.cb-doc:hover{border-color:var(--bt-accent)}
.cb-doc-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bt-accent-soft);color:var(--bt-accent);font-size:13px;flex:none}
.cb-doc-body{flex:1;min-width:0}
.cb-doc-body strong{display:block;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-doc-body small{display:block;margin-top:2px;font-size:9px;color:var(--bt-ink-3)}

.cb-member-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;width:100%}
.cb-member-row:hover{background:var(--bt-hover)}
.cb-member-copy{flex:1;min-width:0}
.cb-member-copy strong{display:block;font-size:10px;font-weight:700}
.cb-member-copy small{display:block;font-size:9px;color:var(--bt-ink-3)}

.cb-timeline{display:flex;flex-direction:column;gap:0}
.cb-tl-item{display:flex;gap:9px;padding:5px 0}
.cb-tl-dot{width:7px;height:7px;border-radius:50%;background:var(--bt-line-2);margin-top:5px;flex:none;position:relative}
.cb-tl-item:not(:last-child) .cb-tl-dot::after{content:'';position:absolute;left:3px;top:9px;width:1px;height:26px;background:var(--bt-line)}
.cb-tl-body{flex:1;min-width:0;font-size:10px;line-height:15px}
.cb-tl-body small{display:block;font-size:8px;color:var(--bt-ink-3);margin-top:2px}

.cb-set-group{margin-bottom:14px}
.cb-set-group>h5{margin:0 0 6px;font-size:10px;color:var(--bt-ink-3);font-weight:650;text-transform:uppercase;letter-spacing:.4px}
.cb-set-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bt-line);border-bottom:0;background:var(--bt-card)}
.cb-set-row:first-of-type{border-radius:12px 12px 0 0}
.cb-set-row:last-of-type{border-bottom:1px solid var(--bt-line);border-radius:0 0 12px 12px}
.cb-set-row:only-of-type{border-radius:12px;border-bottom:1px solid var(--bt-line)}
.cb-set-copy{flex:1;min-width:0}
.cb-set-copy strong{display:block;font-size:11px;font-weight:650}
.cb-set-copy small{display:block;margin-top:2px;font-size:9px;color:var(--bt-ink-3);line-height:14px}
.cb-switch{position:relative;width:34px;height:19px;border:0;border-radius:999px;background:var(--bt-line-2);cursor:pointer;flex:none;transition:background .18s}
.cb-switch::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.cb-switch.on{background:var(--bt-accent)}
.cb-switch.on::after{transform:translateX(15px)}
.cb-seg{display:flex;gap:2px;padding:2px;border:1px solid var(--bt-line);border-radius:9px;background:var(--bt-hover);flex:none}
.cb-seg button{padding:4px 9px;border:0;border-radius:7px;background:transparent;color:var(--bt-ink-3);font-size:9px;cursor:pointer}
.cb-seg button.is-current{background:var(--bt-card);color:var(--bt-ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.cb-result-group{margin-bottom:16px}
.cb-result-group h5{margin:0 0 7px;font-size:10px;color:var(--bt-ink-3);font-weight:650}
.cb-result-row{display:flex;align-items:center;gap:8px;padding:7px;border:1px solid var(--bt-line);border-radius:9px;background:var(--bt-card);margin-bottom:5px;cursor:pointer;text-align:left;width:100%}
.cb-result-row:hover{border-color:var(--bt-accent)}
.cb-result-body{flex:1;min-width:0}
.cb-result-body strong{display:block;font-size:11px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-result-body small{display:block;margin-top:2px;font-size:9px;color:var(--bt-ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-mark{background:var(--bt-accent-soft);color:var(--bt-accent);border-radius:3px;padding:0 2px}

/* ---------- inspector ---------- */
.pv-right{min-height:0;overflow:auto;border-left:1px solid var(--bt-line);background:var(--bt-card)}
.cb-inspector{display:flex;flex-direction:column;min-height:100%;font-family:var(--bt-font);color:var(--bt-ink)}
.cb-inspector-hero{margin:10px;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--bt-accent-soft),var(--bt-card))}
.cb-hero-top{display:flex;align-items:center;gap:10px}
.cb-hero-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.cb-hero-name{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:750;min-width:0}
.cb-hero-name>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-hero-copy>small{font-size:10px;color:var(--bt-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-hero-quote{margin-top:9px;font-size:10px;color:var(--bt-accent);text-align:center;line-height:15px}
.cb-tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:0 10px;border-bottom:1px solid var(--bt-line)}
.cb-tab{padding:9px 0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--bt-ink-3);font-size:10px;cursor:pointer}
.cb-tab:hover{color:var(--bt-ink)}
.cb-tab.is-current{border-bottom-color:var(--bt-accent);color:var(--bt-accent);font-weight:700}
.cb-inspector-body{display:flex;flex-direction:column;gap:13px;padding:12px 13px 22px}
.cb-section{display:flex;flex-direction:column;gap:7px}
.cb-section h4{margin:0;font-size:11px;font-weight:750}
.cb-section-head{display:flex;align-items:center;justify-content:space-between}
.cb-info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 6px}
.cb-info-row{display:flex;flex-direction:column;gap:2px;min-width:0}
.cb-info-label{font-size:9px;color:var(--bt-ink-3)}
.cb-info-value{display:flex;align-items:center;gap:4px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-team-avatars{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.cb-team-avatar{padding:0;border:0;background:transparent;cursor:pointer;line-height:0}
.cb-team-avatar:hover{transform:translateY(-1px)}
.cb-more{padding:2px 6px;border-radius:999px;background:var(--bt-tag-bg);font-size:9px;color:var(--bt-tag-ink);cursor:pointer}
.cb-managed-row{display:flex;align-items:center;gap:6px;padding:4px 0;border:0;background:transparent;color:var(--bt-ink-2);font-size:10px;cursor:pointer;text-align:left;width:100%}
.cb-managed-row:hover{color:var(--bt-ink)}
.cb-managed-row small{font-size:9px;color:var(--bt-ink-3);flex:none}

.cb-graph{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px;border:1px solid var(--bt-line);border-radius:12px}
.cb-graph-root{padding:4px 12px;border-radius:999px;background:var(--bt-accent-soft);color:var(--bt-accent);font-size:10px;font-weight:700;cursor:pointer}
.cb-graph-line{width:64%;height:11px;border-top:1px solid var(--bt-line);border-left:1px solid var(--bt-line);border-right:1px solid var(--bt-line)}
.cb-graph-nodes{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.cb-graph-node{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 9px;border-radius:10px;background:var(--bt-hover);cursor:pointer}
.cb-graph-node:hover{background:var(--bt-active)}
.cb-graph-node strong{font-size:9px;font-weight:650}
.cb-relation{display:grid;grid-template-columns:1fr auto 1fr;gap:5px;padding:5px 6px;border-radius:8px;background:var(--bt-hover);font-size:9px;align-items:center}
.cb-relation b{color:var(--bt-accent);font-size:8px;font-weight:650;white-space:nowrap}

.cb-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid var(--bt-line);border-radius:999px;background:var(--bt-hover);font-size:9px;color:var(--bt-ink-2)}
.cb-chip b{color:var(--bt-accent);font-weight:700}

/* ---------- toast / modal ---------- */
.cb-toast{position:fixed;left:50%;bottom:74px;transform:translate(-50%,14px);z-index:200;padding:9px 15px;border:1px solid var(--bt-line);border-radius:999px;background:var(--bt-card);box-shadow:0 10px 30px -8px rgba(0,0,0,.25);font-size:11px;color:var(--bt-ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
.cb-toast.on{opacity:1;transform:translate(-50%,0)}
.cb-modal-mask{position:fixed;inset:0;z-index:180;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.32);backdrop-filter:blur(2px)}
.cb-modal-mask.on{display:flex}
.cb-modal{width:min(520px,92vw);max-height:80vh;overflow:auto;padding:18px;border-radius:16px;background:var(--bt-card);box-shadow:0 24px 70px -20px rgba(0,0,0,.5)}
.cb-modal h3{margin:0 0 4px;font-size:15px}
.cb-modal p{margin:0 0 14px;font-size:11px;color:var(--bt-ink-2);line-height:17px}
.cb-field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.cb-field label{font-size:9px;color:var(--bt-ink-3)}
.cb-field input,.cb-field textarea,.cb-field select{padding:8px 10px;border:1px solid var(--bt-line);border-radius:9px;background:var(--bt-main);color:var(--bt-ink);font:inherit;font-size:11px;outline:0}
.cb-field input:focus,.cb-field textarea:focus,.cb-field select:focus{border-color:var(--bt-accent)}
.cb-field textarea{min-height:64px;resize:vertical}
.cb-modal-foot{display:flex;justify-content:flex-end;gap:7px;margin-top:4px}
.cb-modal-foot button{padding:7px 14px;border:1px solid var(--bt-line);border-radius:9px;background:var(--bt-card);font-size:11px;cursor:pointer}
.cb-modal-foot button.primary{border-color:transparent;background:var(--bt-accent);color:#fff}

/* ---------- responsive ---------- */
@media(max-width:1180px){.pv-app{grid-template-columns:56px 212px minmax(0,1fr) 244px}}
@media(max-width:980px){
  .pv-app{grid-template-columns:56px 212px minmax(0,1fr)}
  .pv-right{display:none}
  body[data-cb-inspector=on] .pv-right{display:none}
}
@media(max-width:700px){
  .pv-app{grid-template-columns:minmax(0,1fr)}
  .pv-rail,.pv-left{display:none}
  .pv-chat{padding:14px 14px 6px}
  .pv-msg{max-width:92%}
  .pv-task{grid-template-columns:16px 1fr auto 52px 32px}
  .pv-tag{display:none}
  .cb-card-grid{grid-template-columns:1fr}
  .cb-detail{padding:14px 14px 22px}
  .cb-detail-head{flex-wrap:wrap}
  .cb-detail-actions{margin-left:0;width:100%}
}

/* ============ model connection ============ */
.cb-ai-banner{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:9px 12px;border:1px dashed var(--bt-line);border-radius:12px;background:var(--bt-hover);font-size:10px;line-height:15px;color:var(--bt-ink-2);cursor:pointer}
.cb-ai-banner b{color:var(--bt-ink);font-weight:650}
.cb-ai-banner .cb-ai-badge{margin-left:auto;flex:none;padding:2px 8px;border-radius:999px;background:var(--bt-card);border:1px solid var(--bt-line);font-size:9px;color:var(--bt-ink-3)}
.cb-ai-banner.is-on{border-style:solid;border-color:color-mix(in srgb,var(--bt-green) 40%,transparent);background:color-mix(in srgb,var(--bt-green) 8%,transparent)}
.cb-ai-banner.is-on .cb-ai-badge{color:var(--bt-green);border-color:color-mix(in srgb,var(--bt-green) 40%,transparent)}
.cb-ai-banner.is-err{border-color:color-mix(in srgb,var(--bt-danger) 45%,transparent);background:color-mix(in srgb,var(--bt-danger) 8%,transparent)}
.cb-ai-banner.is-err .cb-ai-badge{color:var(--bt-danger);border-color:color-mix(in srgb,var(--bt-danger) 40%,transparent)}
.cb-caret{display:inline-block;width:2px;height:12px;margin-left:2px;vertical-align:-2px;background:var(--bt-accent);animation:cb-blink 1s steps(2) infinite}
@keyframes cb-blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.cb-think{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--bt-ink-3)}
.cb-think .cb-typing{padding:0}
.cb-ai-form{display:flex;flex-direction:column;gap:9px}
.cb-ai-form .cb-field{margin:0}
.cb-ai-hint{font-size:9px;line-height:15px;color:var(--bt-ink-3)}
.cb-ai-actions{display:flex;gap:8px;margin-top:2px}
.cb-ai-actions button{flex:none;padding:7px 12px;border:1px solid var(--bt-line);border-radius:9px;background:var(--bt-card);color:var(--bt-ink-2);font-size:10px;cursor:pointer;white-space:nowrap}
.cb-ai-actions button:hover{background:var(--bt-hover);color:var(--bt-ink)}
.cb-ai-actions button.primary{border-color:transparent;background:var(--bt-accent);color:#fff}
.cb-ai-actions button.primary:hover{filter:brightness(1.08);color:#fff}
.cb-ai-state{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:var(--bt-ink-3)}
.cb-ai-state i{width:6px;height:6px;border-radius:50%;background:var(--bt-ink-3);display:block}
.cb-ai-state.ok i{background:var(--bt-green)}
.cb-ai-state.ok{color:var(--bt-green)}
.cb-ai-state.bad i{background:var(--bt-danger)}
.cb-ai-state.bad{color:var(--bt-danger)}
.cb-ai-key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
.cb-task-created{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.cb-task-created-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--bt-line);border-radius:9px;background:var(--bt-main);font-size:10px;cursor:pointer}
.cb-task-created-row:hover{border-color:var(--bt-accent)}
.cb-task-created-row small{margin-left:auto;color:var(--bt-ink-3);font-size:9px;flex:none}
.pv-bubble.is-err{border-color:color-mix(in srgb,var(--bt-danger) 45%,transparent);background:color-mix(in srgb,var(--bt-danger) 7%,transparent);color:var(--bt-ink)}
.pv-msg.mine .pv-bubble.is-err{border-color:color-mix(in srgb,var(--bt-danger) 45%,transparent)}
#ai-slot{flex:none;padding:0 26px}
#ai-slot:empty{display:none}
#ai-slot .cb-ai-banner{margin:8px 0 0}
@media(max-width:700px){#ai-slot{padding:0 14px}}

/* ============ composer: textarea + stop ============ */
.pv-composer{align-items:flex-end}
.pv-composer textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--bt-ink);font:inherit;font-size:11px;line-height:18px;resize:none;max-height:140px;padding:3px 0;font-family:inherit}
.pv-composer textarea::placeholder{color:var(--bt-ink-3)}
.pv-send.is-stop{background:var(--bt-danger);font-size:9px}
.pv-msg[data-stopped] .pv-bubble::after{content:'（已停止）';display:block;margin-top:4px;font-size:9px;color:var(--bt-ink-3)}

/* ============ task editor ============ */
.cb-task-editor{border:1px solid var(--bt-line);border-radius:12px;padding:10px 11px;background:var(--bt-card)}
.cb-task-editor h4{margin:0 0 8px}
.cb-te-name{font-size:11px;font-weight:650;margin-bottom:9px;color:var(--bt-ink);line-height:16px}
.cb-te-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cb-te-row:last-child{margin-bottom:0}
.cb-te-row label{font-size:9px;color:var(--bt-ink-3);flex:none;width:32px}
.cb-te-row .cb-seg{flex-wrap:wrap;flex:1}
.cb-te-row .cb-seg button{font-size:9px;padding:3px 6px}
.cb-te-row input[type=range]{flex:1;min-width:0;accent-color:var(--bt-accent);height:3px}
.cb-te-row b{font-size:9px;color:var(--bt-ink-2);width:32px;text-align:right;flex:none}
.cb-te-row select{flex:1;padding:5px 8px;border:1px solid var(--bt-line);border-radius:8px;background:var(--bt-main);color:var(--bt-ink);font:inherit;font-size:10px}

/* ============ doc reader ============ */
.cb-doc-read{border:1px solid var(--bt-line);border-radius:12px;background:var(--bt-card);padding:18px 20px;max-width:720px}
.cb-md-h{margin:14px 0 6px;font-size:13px;line-height:19px;color:var(--bt-ink);font-weight:700}
h3.cb-md-h:first-child{margin-top:0;font-size:16px}
h4.cb-md-h{font-size:12px}
h5.cb-md-h,h6.cb-md-h{font-size:11px;color:var(--bt-ink-2)}
.cb-md-p{margin:0 0 7px;font-size:11px;line-height:19px;color:var(--bt-ink-2)}
.cb-md-p b{color:var(--bt-ink)}
.cb-md-p code,.cb-md-pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;background:var(--bt-hover);border-radius:5px;padding:1px 4px}
.cb-md-pre{display:block;padding:10px 12px;margin:0 0 8px;white-space:pre-wrap;line-height:17px}
.cb-md-li{font-size:11px;line-height:19px;color:var(--bt-ink-2);padding-left:2px;margin-bottom:3px}
.cb-md-tr{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--bt-line);font-size:10px;color:var(--bt-ink-2)}
.cb-md-tr:first-of-type,.cb-md-tr span{min-width:0;word-break:break-word}
.cb-md-tr:has(span) span:first-child{color:var(--bt-ink);font-weight:650}

/* 右栏窄宽度下任务行收紧 */
.cb-inspector .cb-task{grid-template-columns:auto minmax(0,1fr) 30px 26px;font-size:9px}
.cb-inspector .cb-task{grid-template-columns:auto minmax(0,1fr) minmax(24px,44px) 30px;align-items:center}
.cb-inspector .cb-task > span:nth-child(3){display:none}
.cb-inspector .cb-task small{text-align:right}
.cb-task-editor .cb-te-row .cb-seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;gap:1px;padding:2px}
.cb-task-editor .cb-te-row .cb-seg button{padding:4px 0;line-height:1.3;font-size:9px;white-space:nowrap;overflow:hidden}
.cb-task-editor .cb-te-row{flex-wrap:wrap}
.cb-task-editor .cb-te-row label{width:auto;flex:none}

  function aiStream(empId, onDelta, onThink) {
    return new Promise(function (resolve, reject) {
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      abortCtl = ctrl;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort() }, 90000);
      var payload = {
        model: AI.model,
        temperature: Number(AI.temp) || 0.6,
        max_tokens: Number(AI.max) || 900,
        stream: true,
        messages: [{ role: 'system', content: aiContext(empId) }].concat(aiMessages(empId))
      };
      fetch(aiUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AI.key },
        body: JSON.stringify(payload),
        signal: ctrl ? ctrl.signal : undefined
      }).then(function (res) {
        if (!res.ok) {
          return res.text().then(function (t) {
            var msg = 'HTTP ' + res.status;
            try {
              var j = JSON.parse(t);
              msg = (j.error && (j.error.message || j.error.code)) || msg;
            } catch (e) { if (t) msg += ' · ' + t.slice(0, 100) }
            throw new Error(msg);
          });
        }
        var ct = res.headers.get('content-type') || '';
        if (ct.indexOf('text/event-stream') < 0) {
          return res.text().then(function (t) {
            var j = JSON.parse(t);
            var c = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
            if (c) onDelta(c);
            return c;
          });
        }
        var reader = res.body.getReader(), dec = new TextDecoder(), buf = '', acc = '';
        function pump() {
          return reader.read().then(function (r) {
            if (r.done) return acc;
            buf += dec.decode(r.value, { stream: true });
            var i;
            while ((i = buf.indexOf('\n')) >= 0) {
              var line = buf.slice(0, i).trim();
              buf = buf.slice(i + 1);
              if (!line || line.indexOf('data:') !== 0) continue;
              var p = line.slice(5).trim();
              if (!p || p === '[DONE]') continue;
              try {
                var jj = JSON.parse(p);
                var d = (jj.choices && jj.choices[0] && jj.choices[0].delta) || {};
                if (d.content) { acc += d.content; onDelta(acc) }
                else if (d.reasoning_content && onThink) onThink();
              } catch (e) {}
            }
            return pump();
          });
        }
        return pump();
      }).then(function (text) {
        clearTimeout(timer);
        abortCtl = null;
        var out = String(text || '').trim();
        if (!out) throw new Error('模型返回空内容');
        resolve(out);
      }).catch(function (e) {
        clearTimeout(timer);
        abortCtl = null;
        reject(e);
      });
    });
  }

  function aiExplain(e) {
    var m = (e && e.message) || '未知错误';
    if (/abort/i.test(m)) return '请求超时（90 秒）';
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '网络不通或接口不允许跨域';
    if (/401|403|invalid token|invalid api key|unauthorized/i.test(m)) return 'Key 无效、过期或没有权限';
    if (/404/.test(m)) return '接口地址不对（检查是否多了或少了 /v1）';
    if (/429/.test(m)) return '请求太频繁，稍后再试';
    return m;
  }

  function parseTasks(text) {
    var keep = [], specs = [];
    String(text || '').split('\n').forEach(function (line) {
      var m = /^\s*\[\[TASK\]\]\s*(.+)$/.exec(line);
      if (!m) { keep.push(line); return }
      var seg = m[1].split('|').map(function (s) { return s.trim() });
      if (!seg[0]) return;
      specs.push({ name: seg[0].slice(0, 24), owner: seg[1] || '', project: seg[2] || '' });
    });
    return {
      text: keep.join('\n').replace(/\n{3,}/g, '\n\n').trim(),
      specs: specs
    };
  }

  function commitTasks(specs, fromId) {
    var made = [];
    (specs || []).forEach(function (s) {
      var owner = null;
      DB.employees.forEach(function (e) {
        if (owner) return;
        if (e.name === s.owner || e.role === s.owner || e.id === s.owner) owner = e;
      });
      if (!owner) return;
      var proj = null;
      DB.projects.forEach(function (p) {
        if (proj) return;
        if (p.name === s.project || p.id === s.project) proj = p;
      });
      if (!proj) proj = DB.projects[0];
      if (!proj) return;
      var dup = DB.tasks.some(function (t) { return t.project === proj.id && t.name === s.name });
      if (dup) return;
      var t = { id: uid('t'), name: s.name, project: proj.id, assignee: owner.id, status: 'pending', pct: 0, due: '待排期', by: fromId };
      DB.tasks.push(t);
      if (owner.status === 'idle') owner.status = 'running';
      recalcProject(proj.id);
      made.push(t);
    });
    if (made.length) saveTasks();
    return made;
  }

  /* ================= center: head ================= */
  function renderCenter() {
    var head = $('#center-head'), body = $('#center-body'), host = $('#composer-wrap'), slot = $('#ai-slot');
    head.innerHTML = centerHead();
    if (slot) slot.innerHTML = aiBanner();

    if (isChat()) {
      body.className = 'pv-chat';
      body.innerHTML = chatMessages();
      if (!host.firstChild) host.innerHTML = composerHTML();
      else {
        var inp = host.querySelector('input');
        if (inp) inp.placeholder = composerPlaceholder();
      }
      host.style.display = '';
      scrollChat(S.scrollMode !== 'top');
      S.scrollMode = 'bottom';
    } else {
      body.className = 'cb-detail';
      body.innerHTML = centerDetail();
      host.innerHTML = '';
      host.style.display = 'none';
    }

  /* ================= center: chat ================= */
  function chatMessages() {
    var list = conv(convId());
    var out = '';
    for (var i = 0; i < list.length; i++) out += msgHTML(list[i], i);
    if (busyId === convId()) out += typingHTML();
    return out;
  }
  function msgHTML(m, i) {
    var mine = m.from === 'me';
    var who = mine ? DB.me : (DB.byId[m.from] || DB.byId.ceo);
    var body = esc(m.text).replace(/\n/g, '<br>');
    var card = m.card ? taskCardHTML(m.card) : '';
    var made = createdTasksHTML(m.tasks);
    var errCls = m.err ? ' is-err' : '';
    var stoppedAttr = m.stopped ? ' data-stopped="1"' : '';
    return '<div class="pv-msg ' + (mine ? 'mine' : '') + '"' + stoppedAttr + '>' +
      avatar(who, 'cb-avatar-sm') +
      '<div class="pv-msg-body">' +
      (mine ? '' : '<div class="pv-msg-name">' + esc(who.name) + '<span style="margin-left:6px;opacity:.7">' + esc(m.time || '') + '</span></div>') +
      '<div class="pv-bubble' + errCls + '">' + body + card + made + '</div>' +
      '<div class="pv-msg-tools"><button type="button" data-act="copy:' + i + '">复制</button>' +
      (mine ? '' : '<button type="button" data-act="quote:' + i + '">引用</button>') +
      (mine ? '<button type="button" data-act="retry:' + i + '">重发</button>' : '') +
      '</div></div></div>';
  }
  function createdTasksHTML(ts) {

        '<small>' + esc(empName(t.assignee)) + '</small></div>';
    }).join('') + '</div>';

      return '<div class="cb-ai-banner" data-act="openai"><span><b>当前是演示回复</b> · 接上模型后，CEO 和员工会基于真实组织数据实时作答，并自动派活</span><span class="cb-ai-badge">去配置 ›</span></div>';

  function typingHTML() {
    return '<div class="pv-msg"><span class="cb-avatar cb-avatar-sm">' + esc((DB.byId[convId()] || DB.byId.ceo).name.slice(0, 1)) + '</span>' +
      '<div class="pv-msg-body"><div class="pv-bubble"><span class="cb-typing"><i></i><i></i><i></i></span></div></div></div>';
  }
  function taskCardHTML(pid) {
    var p = DB.projectById(pid); if (!p) return '';
    var tasks = DB.projectTasks(pid);
    var avg = tasks.length ? Math.round(tasks.reduce(function (a, t) { return a + t.pct }, 0) / tasks.length) : 0;
    var rows = tasks.map(function (t) {
      var cls = t.status === 'done' ? 'done' : t.status === 'running' ? 'running' : 'pending';
      var mark = t.status === 'done' ? '✓' : t.status === 'running' ? '◉' : '○';
      var color = t.status === 'done' ? 'var(--bt-green)' : t.status === 'blocked' ? 'var(--bt-danger)' : 'var(--bt-accent)';
      return '<div class="pv-task" data-act="open:task:' + t.id + '">' +
        '<span class="pv-check ' + cls + '">' + mark + '</span>' +
        '<span>' + esc(t.name) + '</span>' +
        '<span class="pv-tag">' + esc(empName(t.assignee)) + '</span>' +
        '<span class="pv-bar"><i style="width:' + t.pct + '%;background:' + color + '"></i></span>' +
        '<span class="pv-pct">' + t.pct + '%</span></div>';
    }).join('');
    return '<div class="pv-card" id="task-card">' +
      '<div class="pv-card-head"><span>✓ <b>任务分解与分配</b></span>' +
      '<span class="cb-link" data-act="open:project:' + p.id + '">查看详情 ›</span></div>' + rows +
      '<div class="pv-overall"><span>当前项目整体进度：' + avg + '%</span><span class="pv-bar"><i style="width:' + avg + '%;background:var(--bt-accent)"></i></span></div></div>';

  function mdHTML(src) {
    var out = [], inCode = false;
    String(src || '').split('\n').forEach(function (line) {
      if (/^```/.test(line)) { inCode = !inCode; out.push(inCode ? '<pre class="cb-md-pre">' : '</pre>'); return }
      if (inCode) { out.push(esc(line)); return }
      if (/^\s*$/.test(line)) { out.push(''); return }
      var m;
      if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) { out.push('<h' + (m[1].length + 2) + ' class="cb-md-h">' + esc(m[2]) + '</h' + (m[1].length + 2) + '>'); return }
      if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) { out.push('<div class="cb-md-li">· ' + esc(m[1]) + '</div>'); return }
      if ((m = /^\s*\d+\.\s+(.*)$/.exec(line))) { out.push('<div class="cb-md-li">' + esc(m[1]) + '</div>'); return }
      if (/^\|/.test(line)) {
        if (/^\|[\s:\-|]+\|?$/.test(line)) return;   /* 表格分隔行 |---|---| */
        var cells = line.replace(/^\||\|$/g, '').split('|').map(function (c) { return '<span>' + esc(c.trim()) + '</span>' });
        out.push('<div class="cb-md-tr">' + cells.join('') + '</div>');
        return;
      }
      out.push('<p class="cb-md-p">' + esc(line).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>').replace(/\[ \]/g, '☐') + '</p>');
    });
    return out.join('');
  }

  function buildReport(p) {
    var ts = DB.projectTasks(p.id);
    var done = ts.filter(function (t) { return t.status === 'done' });
    var active = ts.filter(function (t) { return t.status === 'running' || t.status === 'review' });
    var blocked = ts.filter(function (t) { return t.status === 'blocked' });
    var L = [];
    L.push('# ' + p.name + ' · 周报');
    L.push('');
    L.push('生成于 ' + new Date().toLocaleDateString('zh-CN') + '，负责人 ' + empName(p.lead) + '，整体进度 ' + p.pct + '%。');
    L.push('');
    L.push('## 本周进展');
    L.push('');
    if (done.length) done.forEach(function (t) { L.push('- 已完成：' + t.name + '（' + empName(t.assignee) + '）') });
    if (active.length) active.forEach(function (t) { L.push('- 进行中：' + t.name + ' ' + t.pct + '%（' + empName(t.assignee) + '）') });
    if (!done.length && !active.length) L.push('- 本周无实质性推进');
    L.push('');
    L.push('## 风险');
    L.push('');
    if (blocked.length) blocked.forEach(function (t) { L.push('- ' + t.name + '：' + (t.note || '原因待补充') + '，责任人 ' + empName(t.assignee)) });
    else L.push('- 暂无阻塞项');
    L.push('');
    L.push('## 下周计划');
    L.push('');
    var pend = ts.filter(function (t) { return t.status === 'pending' });
    if (pend.length) pend.slice(0, 5).forEach(function (t) { L.push('- 启动：' + t.name + '（' + empName(t.assignee) + '，截止 ' + t.due + '）') });
    else L.push('- 收敛剩余进行中任务，准备验收');
    return L.join('\n');
  }
